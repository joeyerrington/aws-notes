edictive - Automated scheduling based on trends","children":[]},{"text":"Cooldown period stops repeated scaling actions","children":[]}]}]}]},{"text":"RDS","children":[{"text":"Auto Scaling - Set GB limit","children":[]},{"text":"Read Replicas","children":[{"text":"Asyncronous. Eventual consistency for horizontal scaling.","children":[]},{"text":"Can be promoted to main db","children":[]},{"text":"Same region cross AZ free. Cross region has fee","children":[]}]},{"text":"Multi-AZ","children":[{"text":"Syncronous replication","children":[]},{"text":"App talks to one DNS Name. Same connection string","children":[]},{"text":"Automatic failover if AZ drops. Not for scalability","children":[]},{"text":"Low downtime. One click via DB snapshot","children":[]}]},{"text":"Custom - For Oracle and MS SQL only. Allows access underling infra","children":[]},{"text":"Backup - Daily backup plus transaction log of 5 minutes. 1-35 day retention","children":[]},{"text":"Clone - Faster than snapshop and restore. Copy on write proto","children":[]},{"text":"Event Notifications - Events about DB instance. Not data itself","children":[]},{"text":"Data Events contain data and can invoke Lambda with outbound traffic enabled (NAT/VPC Endpoint)","children":[]},{"text":"RDS Proxy - Allows apps to pool DB connections","children":[{"text":"MySQL, PostgeSQL, MariaDB, MS and Aurora.Must be accessed from within VPC","children":[]},{"text":"66% improved availabily","children":[]},{"text":"Can enforce IAM","children":[]}]},{"text":"Aurora - Postgres & MySQL","children":[{"text":"Grows in 10gb increments up to 256TB","children":[]},{"text":"Up to 15 replicas. Autmated failover. Cross-region supported","children":[]},{"text":"6 copies across 3 AZ. 4 for write, 3 for Read","children":[]},{"text":"Self healing","children":[]},{"text":"Reader endpoint load balances across all read replicas","children":[]},{"text":"Custom Endpoints - Define and endpoint for particular connections to use","children":[]},{" .0/24 goes to 192.168.0.255","children":[]},{"text":"/16 allows for 65,536 so 192.168.255.255 (max for a VPC)","children":[]},{"text":"/8 allows 192.255.255.255","children":[]},{"text":"/0 allows for all so 255.255.255.255","children":[]},{"text":"172.31.0.0/16 - AWS default for VPC","children":[]},{"text":"If CIDR block 10.0.0.0/24. First 4 & last 1 IP is reserved","children":[{"text":"10.0.0.0 - Network address","children":[]},{"text":"10.0.0.1 - Reseved for VPC router","children":[]},{"text":"10.0.0.2 - Reseved for amazon-provided DNS","children":[]},{"text":"10.0.0.3 - Reseved for future use","children":[]},{"text":"10.0.0.255 - Network broadcast address","children":[]}]},{"text":"Subnet CIDR - Smaller range of VPC CIDR","children":[{"text":"Cannot overlap in the same VPC`","children":[]}]}]},{"text":"VPC","children":[{"text":"All new AWS accounts have one with public IP assigned","children":[]},{"text":"Peering - Connect two VPCs if no overlapping CIDR","children":[{"text":"Use route tables to map each VPC's CIDR to peering connection","children":[]},{"text":"Non-transitive - Needs to be P2P if >2 VPCs","children":[]},{"text":"Security group in peered VPC can be referenced","children":[]}]}]},{"text":"Subnet","children":[{"text":"Public or private set of IPs within a VPC","children":[]}]},{"text":"Internet Gateway","children":[{"text":"Allows resources in VPC to connect to internet","children":[]},{"text":"Create seperate from VPC. One per VPC","children":[]},{"text":"Does not give internet access alone. Needs route table","children":[]},{"text":"Outbound - Translates resources private IPv4 address to a public address","children":[]},{"text":"Inbound - That in reverse","children":[]}]},{"text":"Router","children":[{"text":"Moves network traffic between destinations based on rules in route tables","children":[]},{"text":"Both inbound and outbound","children":[]},{"text":"AWS manages the VPC router automatically.","children":[]}]},{"text":"Route Tables","children":[{"text":"Routes from internet gateway to subnets, Makes private subnet public","children":[]},{"text":"Multiple subnets can share a route table","children":[]},{"text":"Specify CIDR and target. Return path enabled by default","children":[]},{"text":"Pubic subnet - Default route 0.0.0.0/0 → Internet Gateway","children":[]},{"text":"Private subnet","children":[{"text":"Does not have a direct route to an Internet Gateway","children":[]},{"text":"May use 0.0.0.0/0 → NAT Gateway for outbound internet access.","children":[]}]}]},{"text":"Bastion Host","children":[{"text":"EC2 instance in a public subnet","children":[]},{"text":"Can SSH into EC2 in private subnet via security groups","children":[]},{"text":"Must allow inbound from internet on port 22 from public CIDR","children":[]},{"text":"Security group of private EC2 must allow SSH from IP or SG of bastion host","children":[]}]},{"text":"NAT - Network Address Translation","children":[{"text":"Outbound only but can accept responses","children":[]},{"text":"NAT Instance","children":[{"text":"Allows EC2 in private subnet to access internet","children":[]},{"text":"Must be launched in public subnet with elastic IP","children":[]},{"text":"Disable source/destinationCheck","children":[]},{"text":"Subject to limitations of EC2","children":[]}]},{"text":"NAT Gateway","children":[{"text":"AWS managed NAT. Pay per hour","children":[]},{"text":"Created in an AZ in public subnet. uses Elastic IP. Autoscaling","children":[]}]},{"text":"Regional NAT Gateway (RNAT)","children":[{"text":"One the VPC. Don't need to create public subnets. Shared across AZs","children":[]},{"text":"Has its own route tables","children":[]}]}]},{"text":"Egress Only Internet Gateway","children":[{"text":"Like NAT but only for IPv6","children":[]}]},{"text":"Network Access Control List (NACL)","children":[{"text":"Set of L4 allow/deny rules set at the subnet level","children":[]},{"text":"One per subnet, but multiple subnets can share one","children":[]}, Completed by DX partners","children":[]}]},{"text":"Hosted Connection","children":[{"text":"50Mbps-25Gbps. On-demand capacity","children":[]},{"text":"Fully managed by DX partners","children":[]}]},{"text":"Virtual Interfaces (VIFs)","children":[{"text":"Private VIF - Access private resources in a VPC","children":[]},{"text":"Public VIF - Access AWS services through public IP endpoints without public internet","children":[]},{"text":"Transit VIF - Access multiple VPCs through a central hub","children":[]}]},{"text":"Over 1 month lead time","children":[]},{"text":"Not encrpyted by default. Can be done via VPN connection","children":[]},{"text":"High resiliancy - 2 connections across 2 DX locations","children":[]},{"text":"Maximum resiliancy - 4 connections across 4 DX locations","children":[]}]},{"text":"Transit Gateway","children":[{"text":"Transitive peering between many VPCs in hub/spoke pattern","children":[]},{"text":"Regional. Can work cross-region. Supports IP multicast","children":[]},{"text":"Can have DX Gateway and VPN connection as spokes","children":[{"text":"Multiple VPCs can share 1 DX Gateway","children":[]}]},{"text":"Route tables limit which VPC can talk to which","children":[]},{"text":"ECMP (Equal-Cost Multi-Path) routing","children":[{"text":"Traffic distributed across multiple routes...","children":[{"text":"That have the same destination and routing priority","children":[]}]},{"text":"VGW has 1.25Gbps. ECMP allows this to be stacked","children":[]}]}]},{"text":"VPC Traffic Mirroring","children":[{"text":"Capture and inspect network traffic in VPC","children":[]},{"text":"ROute traffic to security apps we manage","children":[]},{"text":"From ENI and to ENI of NLB. Can have multiple sources to one target","children":[]},{"text":"Same VPC or x-VPC if peered","children":[]}]},{"text":"IPv6","children":[{"text":"Beacause IPv4 will run out","children":[]},{"text":"Every IPv6 in AWS can be public and internet-routable","children":[]},{"text":"Requies seperate CIDR range in VPC","children":[]}]},{"text":"Network Firewall","children":[{"text":"Layers 3-7 protection","children":[]},{"text":"Inspect inbound, outpount and x-VPC","children":[]}]}]},{"text":"Disaster Recovery","children":[{"text":"Elastic Disaster Recovery (CloudEndure)","children":[{"text":"Resover physical & cloud servers into AWS","children":[]},{"text":"Continous block-level replication","children":[]}]},{"text":"Database Migration Service (DMS)","children":[{"text":"Migrate from on-prem or AWS","children":[]},{"text":"Sources - On-prem, EC2, Azure SQL, RDS, Aurora, S3, DocumentDB","children":[]},{"text":"Targets - On-prem, EC2, RDS, Aurora, S3, DocumentDB, OpenSearch, Redshift","children":[{"text":"Kafka, Nepture, Redis & Babelfish","children":[]}]},{"text":"Source db remains during migration","children":[]},{"text":"Continous data replication using CDC","children":[]},{"text":"Must create EC2 instance to run","children":[]},{"text":"Schema COnversion Tool (SCT)","children":[{"text":"If source and target schema are different","children":[]}]}]},{"text":"RDS & Aurora MySQl Migrations","children":[{"text":"RDS to Aurora","children":[{"text":"Option 1: DB Snapshots = downtime","children":[]},{"text":"Option 2: Create read replica and promote = time & $","children":[]}]},{"text":"MySQL to Aurora","children":[{"text":"Option 1: Percona XtraBackup creates file in S3","children":[{"text":"Create DB from S3 file","children":[]}]},{"text":"Option 2: Aurora MySQL DB. mysqldump utility. Slower than S3","children":[]}]},{"text":"Use DMS if both DB are up and running","children":[]}]},{"text":"On-Prem Combo","children":[{"text":"Ability to download Amazon Linux 2 AMI as VM (.iso)","children":[{"text":"Run AWS Linuz on-prem","children":[]}]},{"text":"VM Import/Export","children":[{"text":"Migrate applications into EC2 and vice versa","children":[]}]},{"text":"AWS Application Discovery Service","children":[{"text":"Gather info about on-prem servers to plan migration","children":[]},{"text":"Track with AWS Migration Hub","children":[]},{"text":"Agentless: VM config, memory, disk usage ElastiCache","children":[]},{"text":"Agent-based: Further detail on running processes and connections","children":[]}]},{"text":"Application Migration Service (MGN)","children":[{"text":"Incremental replication of on-prem servers to AWS","children":[]}]}]},{"text":"AWS Backup","children":[{"text":"Fully managed. Automates backups across AWS. Supports X-region","children":[]},{"text":"EC2/EBS, S3, RDS, DocumentDB, Neptune, EFS, FSx Lustre/Windows, Volume Gateway","children":[]},{"text":"Point in time recovery. On demand and scheduled","children":[]},{"text":"Backup policies/backup plans","children":[{"text":"Frequency, window, transition to cold storage, retention period","children":[]}]},{"text":"Can enforce WORM to prevent deletion. Can even prevent root user deleting","children":[]}]},{"text":"VMware Cloud (EVS)","children":[{"text":"Run existing VMware envs on AWS","children":[]}]},{"text":"Data Transfer","children":[{"text":"Public Internet / Site-to-Site VPN","children":[{"text":"Immediate Setup","children":[]},{"text":"200 TB over 100 Mbps will take 185d","children":[]}]},{"text":"Direct Connect 1Gbps","children":[{"text":"Month-long setup","children":[]},{"text":"18.5 days","children":[]}]},{"text":"Snowball","children":[{"text":"1 week, Can be combined with DMS","children":[]}]}]}]},{"text":"Other Services","children":[{"text":"CloudFormation - IAC dashboard. Generates diagrams","children":[{"text":"Service Role","children":[{"text":"Allows it to create and update resources","children":[]},{"text":"Gives users resource-level permission without working within them","children":[]}]},{"text":"Instance Scheduler","children":[{"text":"Automatically start/stop services to reduce costs","children":[]},{"text":"Supports EC2, ASG, RDS","children":[]},{"text":"Schedules are managed in DynamoDB table","children":[]},{"text":"Uses tags and Lambda to orchestrate","children":[]}]}]},{"text":"Elastic Beanstalk - IAC and managed sevices based on code input","children":[{"text":"Application > Version > Launch > Manager","children":[]},{"text":"Uses CloudFormation","children":[]}]},{"text":"App Runner","children":[{"text":"Deploys and scales containerised applications from source code or container images","children":[]}]},{"text":"SES - Simple Email Service","children":[]},{"text":"Pointpoint - Automated personalised emails","children":[]},{"text":"SSM Session manager","children":[{"text":"Centralised SSH access to all EC2 without SSH keys","children":[]},{"text":"Don't need to expose port 22","children":[]},{"text":"Uses parameter store","children":[]}]},{"text":"Outposts","children":[{"text":"AWS racks installed on premises","children":[]},{"text":"Low latency, data residency","children":[]}]},{"text":"App Flow","children":[{"text":"Integration service between SaaS platforms and AWS","children":[]},{"text":"SAP, Zendesk, SeervieNow, Slack, Datadog etc","children":[]},{"text":"Destinations can be S3, Redshift or non-AWS like SnowFlake","children":[]}]},{"text":"Amplify","children":[{"text":"Toolset to setup app on AWS","children":[]},{"text":"Connect servers managed by Amplify backend to front-end libraries","children":[]}]},{"text":"Cost Explorer","children":[{"text":"Visualise cost & usage over time","children":[]},{"text":"Create custom report","children":[]},{"text":"Choose optimal savings plan. Forcast up to 18 months","children":[]}]},{"text":"Cost Anamaly Detection","children":[{"text":"ML automated detection of unusual costs","children":[]},{"text":"Can use individual alerts or summary with SNS","children":[]}]},{"text":"Batch","children":[{"text":"Batch processing service","children":[]},{"text":"Will dynamically launch EC2 instances","children":[]},{"text":"Defined as docker images and run on ECS, EKS, Fargate","children":[]},{"text":"No limit on time and disk like Lambda","children":[]}]},{"text":"AWS Trusted Advisor","children":[{"text":"Recommendations for cost, security, performance, fault tolerance and service limits","children":[]}]}]},{"text":"Costs Considerations","children":[{"text":"EC2","children":[{"text":"Free going in. Paid going out of AWS","children":[]},{"text":"Free within AZ","children":[]},{"text":"X-Availability Zone","children":[{"text":"$0.02 per GB if public IP","children":[]},{"text":"$0.01 if using private IP","children":[]}]},{"text":"X-Region - $0.02 per GB","children":[]}]},{"text":"S3","children":[{"text":"S3 ingress Free","children":[]},{"text":"S3 to internet $0.09 per GB","children":[]},{"text":"Transfer acceleration +$0.04-0.08 per GB","children":[]},{"text":"S3 to CloudFront Free","children":[]},{"text":"Cloudfront to internet $0.085 per GB","children":[]},{"text":"X-region replication $0.02 per GB","children":[]}]}]},{"text":"Misc","children":[{"text":"AWS Well-Architected Framework","children":[{"text":"Six pillars: Operational Excellence, Security, Reliability","children":[{"text":"Performance Efficiency, Cost Optimisation, Sustainability","children":[]}]}]},{"text":"AWS Shared Responsibility Model","children":[{"text":"AWS security of the cloud vs customer security in the cloud","children":[]}]}]}];
const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),status=document.getElementById('status');
const sidebar=document.getElementById('sidebar'),shade=document.getElementById('shade');
const next=document.getElementById('next'),prev=document.getElementById('prev'),close=document.getElementById('close');
let matches=[],active=-1;
const count=n=>1+n.children.reduce((a,c)=>a+count(c),0);
const total=DATA.reduce((a,n)=>a+count(n),0);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function marked(text){const span=el('span','node-text');span.textContent=text;return span}
function makeNode(n){
 const wrap=el('div','node'),row=el('div','node-row'),toggle=el('button','node-toggle',n.children.length?'⌄':'');
 if(!n.children.length)toggle.classList.add('leaf');
 toggle.setAttribute('aria-label','Toggle '+n.text);
 row.append(toggle,marked(n.text));wrap.append(row);
 if(n.children.length){const children=el('div','node-children');n.children.forEach(c=>children.append(makeNode(c)));wrap.append(children);toggle.onclick=()=>wrap.classList.toggle('collapsed')}
 return wrap;
}
function render(){
 content.replaceChildren();nav.replaceChildren();
 DATA.forEach((root,i)=>{
  const sec=el('section','section');sec.id='topic-'+i;
  const head=el('div','section-head'),toggle=el('button');
  toggle.append(el('span','chev','⌄'),el('span','title',root.text),el('span','count',count(root)+' lines'));
  toggle.onclick=()=>sec.classList.toggle('collapsed');head.append(toggle);sec.append(head);
  const body=el('div','section-body');root.children.forEach(c=>body.append(makeNode(c)));sec.append(body);content.append(sec);
  const link=el('a','nav-item',root.text);link.href='#'+sec.id;link.onclick=closeMenu;nav.append(link);
 });
 status.textContent=DATA.length+' topics · '+total+' notes';
}
function closeMenu(){sidebar.classList.remove('open');shade.classList.remove('show')}
document.getElementById('menu').onclick=()=>{sidebar.classList.toggle('open');shade.classList.toggle('show')};
shade.onclick=closeMenu;
document.getElementById('expand').onclick=()=>document.querySelectorAll('.collapsed').forEach(e=>e.classList.remove('collapsed'));
document.getElementById('collapse').onclick=()=>document.querySelectorAll('.section,.node').forEach(e=>{if(e.classList.contains('section')||e.querySelector(':scope > .node-children'))e.classList.add('collapsed')});
function clearMarks(){
 document.querySelectorAll('.match').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)));
 content.normalize();matches=[];active=-1;
}
function findMatches(){
 clearMarks();
 const q=search.value.trim();
 if(!q){status.textContent=DATA.length+' topics · '+total+' notes';next.disabled=prev.disabled=true;return}
 const lower=q.toLocaleLowerCase();
 const texts=[...document.querySelectorAll('.section-head .title,.node-text')];
 for(const node of texts){
  const original=node.textContent,lo=original.toLocaleLowerCase();
  let from=0,pos;
  const frag=document.createDocumentFragment();
  while((pos=lo.indexOf(lower,from))!==-1){
   frag.append(document.createTextNode(original.slice(from,pos)));
   const mark=el('mark','match',original.slice(pos,pos+q.length));
   frag.append(mark);matches.push(mark);from=pos+q.length;
  }
  if(from){frag.append(document.createTextNode(original.slice(from)));node.replaceChildren(frag)}
 }
 next.disabled=prev.disabled=!matches.length;
 status.textContent=matches.length?(matches.length+' matches · tap Next to jump'):'No matches';
 if(matches.length)go(0);
}
function go(index){
 if(!matches.length)return;
 if(active>=0)matches[active].classList.remove('current');
 active=(index+matches.length)%matches.length;
 const m=matches[active];
 let p=m.parentElement;
 while(p&&p!==content){if(p.classList.contains('collapsed'))p.classList.remove('collapsed');p=p.parentElement}
 m.classList.add('current');
 status.textContent=(active+1)+' of '+matches.length+' matches';
 m.scrollIntoView({block:'center',behavior:'instant'});
}
next.onclick=()=>go(active+1);
prev.onclick=()=>go(active-1);
close.onclick=()=>{search.value='';clearMarks();document.querySelectorAll('.collapsed').forEach(x=>x.classList.remove('collapsed'));status.textContent=DATA.length+' topics · '+total+' notes';next.disabled=prev.disabled=true;search.blur()};
let debounce;
search.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(findMatches,120)});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go(active+(e.shiftKey?-1:1));search.blur()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();search.focus();search.select()}
 if(e.key==='Escape'){close.click();closeMenu()}
});
render();
</script></body></html>
