function count(n){return 1+n.children.reduce((v,c)=>v+count(c),0)}
function textMatch(t,q){return t.toLocaleLowerCase().includes(q)}
function contains(n,q){return textMatch(n.text,q)||n.children.some(c=>contains(c,q))}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function marked(text,q){const frag=document.createDocumentFragment();if(!q){frag.append(document.createTextNode(text));return frag}const lower=text.toLocaleLowerCase();let at=0,pos;while((pos=lower.indexOf(q,at))!==-1){frag.append(document.createTextNode(text.slice(at,pos)));const m=el('mark','match',text.slice(pos,pos+q.length));frag.append(m);at=pos+q.length}frag.append(document.createTextNode(text.slice(at)));return frag}

function render(){const q=search.value.trim().toLocaleLowerCase();content.replaceChildren();nav.replaceChildren();let shown=0;DATA.forEach((root,i)=>{if(q&&!contains(root,q))return;shown++;const sec=el('section','section');sec.id='topic-'+i;const head=el('div','section-head'),toggle=el('button');const chev=el('span','chev','⌄');const title=el('span','title',root.text);const cnt=el('span','count',count(root)+' lines');toggle.append(chev,title,cnt);toggle.onclick=()=>sec.classList.toggle('collapsed');head.append(toggle);sec.append(head);const body=el('div','section-body');for(const c of root.children){const node=makeNode(c,q);if(node)body.append(node)}sec.append(body);content.append(sec);const link=el('a','nav-item',root.text);link.href='#'+sec.id;link.onclick=()=>{closeMenu();};nav.append(link)});if(!shown)content.append(el('div','empty','No matching notes. Try a different term.'));status.textContent=q?shown+' matching topics · '+total+' total notes':DATA.length+' topics · '+total+' notes · Original wording preserved';}
