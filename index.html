", "depth": 2, "children": []}, {"text": "DNS logs etc to find threats and encoded data in DNS queries", "depth": 2, "children": []}, {"text": "Optional EKS, RDS, EBS, Lambda, S3 data events", "depth": 2, "children": []}, {"text": "30 day free trial. EventBridge can notify.", "depth": 2, "children": []}, {"text": "Good for cyptocurrency mining attacks", "depth": 2, "children": []}]}, {"text": "Inspector - Automated security assessment", "depth": 1, "children": [{"text": "E2C - Analyse network accessibilty and known vunerabilities", "depth": 2, "children": []}, {"text": "Container Images - As above", "depth": 2, "children": []}, {"text": "Lambda - Software and package dependency issues on deploy", "depth": 2, "children": []}, {"text": "Reports to AWS Security Hub and EventBridge", "depth": 2, "children": []}]}, {"text": "Macie - Finds sensitive data and PII in S3", "depth": 1, "children": []}, {"text": "AWS Trusted Advisor - Security recommendations", "depth": 1, "children": [{"text": "Recommendations for cost, security, performance, fault tolerance and service limits", "depth": 2, "children": []}]}, {"text": "AWS Config - Configuration tracking, compliance evaluation and auditing", "depth": 1, "children": [{"text": "What the resource configuration looks like and how it changed.", "depth": 2, "children": []}, {"text": "Tracks changes in your AWS resources. Per-region service", "depth": 2, "children": []}, {"text": "Checks compliance against reconfigured rules.", "depth": 2, "children": []}, {"text": "No deny action. Has remediations, retries and notifications No free tier.", "depth": 2, "children": []}, {"text": "$0.003 per item recorded per region", "depth": 2, "children": []}]}, {"text": "Network Firewall", "depth": 1, "children": [{"text": "Layers 3-7 protection", "depth": 2, "children": []}, {"text": "Inspect inbound, outpount and x-VPC", "depth": 2, "children": []}]}, {"text": "AWS Artifact - Compliance reports and agreements", "depth": 1, "children": [{"text": : "Subnet CIDR - Smaller range of VPC CIDR", "depth": 2, "children": [{"text": "Cannot overlap in the same VPC`", "depth": 3, "children": []}]}]}, {"text": "VPC", "depth": 1, "children": [{"text": "All new AWS accounts have one with public IP assigned", "depth": 2, "children": []}, {"text": "Peering - Connect two VPCs if no overlapping CIDR", "depth": 2, "children": [{"text": "Use route tables to map each VPC's CIDR to peering connection", "depth": 3, "children": []}, {"text": "Non-transitive - Needs to be P2P if >2 VPCs", "depth": 3, "children": []}, {"text": "Security group in peered VPC can be referenced", "depth": 3, "children": []}]}, {"text": "Sharing", "depth": 2, "children": [{"text": "Share one VPC across accounts", "depth": 3, "children": []}, {"text": "No x-region", "depth": 3, "children": []}, {"text": "One account owns VPC. Other deploys resources into shared subnets", "depth": 3, "children": []}]}, {"text": "Subnet - Public or private set of IPs within a VPC", "depth": 2, "children": [{"text": "Becomes public or private based on its route table", "depth": 3, "children": []}]}]}, {"text": "Route Tables", "depth": 1, "children": [{"text": "Routes from internet gateway to subnets, Makes private subnet public", "depth": 2, "children": []}, {"text": "Multiple subnets can share a route table", "depth": 2, "children": []}, {"text": "Specify CIDR and target. Return path enabled by default", "depth": 2, "children": []}, {"text": "Pubic subnet - Default route 0.0.0.0/0 → Internet Gateway", "depth": 2, "children": []}, {"text": "Private subnet", "depth": 2, "children": [{"text": "Does not have a direct route to an Internet Gateway", "depth": 3, "children": []}, {"text": "May use 0.0.0.0/0 → NAT Gateway for outbound internet access", "depth": 3, "children": []}]}]}, {"text": "Router", "depth": 1, "children": [{"text": "Moves network traffic between destinations based on rules in route tables", "depth": 2, "children": []}, {"text": "Both inbound and outbound", "depth": 2, "children": []}, {"text": "AWS manages the VPC router automatically", "depth": 2, "children": []}]}, {"text": "Internet Gateway", "depth": 1, "children": [{"text": "Allows resources in VPC to connect to internet", "depth": 2, "children": []}, {"text": "Create seperate from VPC. One per VPC", "depth": 2, "children": []}, {"text": "Does not give internet access alone. Needs route table", "depth": 2, "children": []}, {"text": "Outbound - Translates resources private IPv4 address to a public address", "depth": 2, "children": []}, {"text": "Inbound - That in reverse", "depth": 2, "children": []}]}, {"text": "Bastion Host", "depth": 1, "children": [{"text": "EC2 instance in a public subnet", "depth": 2, "children": []}, {"text": "Can SSH into EC2 in private subnet via security groups", "depth": 2, "children": []}, {"text": "Must allow inbound from internet on port 22 from public CIDR", "depth": 2, "children": []}, {"text": "Security group of private EC2 must allow SSH from IP or SG of bastion host", "depth": 2, "children": []}]}, {"text": "NAT - Network Address Translation", "depth": 1, "children": [{"text": "Outbound only but can accept responses", "depth": 2, "children": []}, {"text": "NAT Instance", "depth": 2, "children": [{"text": "Allows EC2 in private subnet to access internet", "depth": 3, "children": []}, {"text": "Must be launched in public subnet with elastic IP", "depth": 3, "children": []}, {"text": "Disable source/destinationCheck", "depth": 3, "children": []}, {"text": "Subject to limitations of EC2. Supports port forwarding", "depth": 3, "children": []}]}, {"text": "NAT Gateway", "depth": 2, "children": [{"text": "AWS managed NAT. Pay per hour", "depth": 3, "children": []}, {"text": "Created in an AZ in public subnet. uses Elastic IP. Autoscaling", "depth": 3, "children": []}, {"text": "Port fowarding needs to be done on load balancer", "depth": 3, "children": []}]}, {"text": "Regional NAT Gateway (RNAT)", "depth": 2, "children": [{"text": "One the teway", "depth": 2, "children": []}, {"text": "Interface Endpoint", "depth": 2, "children": [{"text": "Provisions an ENI (private IP address) as entry point", "depth": 3, "children": []}, {"text": "Must attach a securty group", "depth": 3, "children": []}, {"text": "Most AWS services. $ per hour + GB used", "depth": 3, "children": []}]}, {"text": "Gateway Endpoint", "depth": 2, "children": [{"text": "Provisions a gateway as entry point", "depth": 3, "children": []}, {"text": "Must be used as target in a route table", "depth": 3, "children": []}, {"text": "S3, DynamoDB only. Free. Autoscaling", "depth": 3, "children": []}]}]}, {"text": "VPC Flow logs", "depth": 1, "children": [{"text": "Capture info about IP traffic going into interfaces", "depth": 2, "children": []}, {"text": "Monitors and troubleshoots connectivity issues", "depth": 2, "children": []}, {"text": "Can go to S3, CloudWatch Logs, Kinesis Data Firehose", "depth": 2, "children": []}, {"text": "Captures network info from managed services too", "depth": 2, "children": [{"text": "ELB, RDS, Elasticache, Redshift, WorkSpaces, NATGW, Transit GW", "depth": 3, "children": [{"text": "Can assume role to do this", "depth": 4, "children": []}, {"text": "Can also create resource policy with wizard", "depth": 4, "children": []}]}]}, {"text": "VPC Flow Logs", "depth": 2, "children": []}, {"text": "Subnet Flow Logs", "depth": 2, "children": []}, {"text": "Elastic Network Interface (ENI) Flow Logs", "depth": 2, "children": []}]}, {"text": "Site to Site VPN (IPSec VPN)", "depth": 1, "children": [{"text": "Integration to on-prem server over public internet", "depth": 2, "children": []}, {"text": "Virtual private gateway (VGW). Created and attached to VPCs", "depth": 2, "children": [{"text": "Can customise Autonomous Service Number (ASN)", "depth": 3, "children": []}, {"text": "Enable ICMP protocol inbound on security groups", "depth": 3, "children": []}, {"text": "Enable route propegation in subnet", "depth": 3, "children" const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),status=document.getElementById('status');
const sidebar=document.getElementById('sidebar'),shade=document.getElementById('shade');
const next=document.getElementById('next'),prev=document.getElementById('prev'),close=document.getElementById('close');
let matches=[],active=-1;
const count=n=>1+n.children.reduce((a,c)=>a+count(c),0);
const total=DATA.reduce((a,n)=>a+count(n),0);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function marked(text){const span=el('span','node-text');span.textContent=text;return span}
function makeNode(n){
 const wrap=el('div','node'),row=el('div','node-row'),toggle=el('button','node-toggle',n.children.length?'⌄':'');
 wrap.dataset.depth=n.depth;if(!n.children.length)toggle.classList.add('leaf');
 toggle.setAttribute('aria-label','Toggle '+n.text);
 row.append(toggle,marked(n.text));wrap.append(row);
 if(n.children.length){if(n.depth>=1)wrap.classList.add('collapsed');const children=el('div','node-children');n.children.forEach(c=>children.append(makeNode(c)));wrap.append(children);toggle.onclick=()=>wrap.classList.toggle('collapsed')}
 return wrap;
}
function render(){
 content.replaceChildren();nav.replaceChildren();
 DATA.forEach((root,i)=>{
  const sec=el('section','section collapsed');sec.id='topic-'+i;
  const head=el('div','section-head'),toggle=el('button');
  toggle.append(el('span','chev','⌄'),el('span','title',root.text),el('span','count',count(root)+' lines'));
  toggle.onclick=()=>sec.classList.toggle('collapsed');head.append(toggle);sec.append(head);
  const body=el('div','section-body');root.children.forEach(c=>body.append(makeNode(c)));sec.append(body);content.append(sec);
  const link=el('a','nav-item',root.text);link.href='#'+sec.id;link.onclick=closeMenu;nav.append(link);
 });
 status.textContent=DATA.length+' topics · '+total+' notes';
}
function closeMenu(){sidebar.classList.remove('open');shade.classList.remove('show')}
document.getElementById('menu').onclick=()=>{sidebar.classList.toggle('open');shade.classList.toggle('show')};
shade.onclick=closeMenu;
document.getElementById('expand').onclick=()=>document.querySelectorAll('.collapsed').forEach(e=>e.classList.remove('collapsed'));
document.getElementById('collapse').onclick=()=>document.querySelectorAll('.section,.node').forEach(e=>{if(e.classList.contains('section')||e.querySelector(':scope > .node-children'))e.classList.add('collapsed')});
function clearMarks(){
 document.querySelectorAll('.match').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)));
 content.normalize();matches=[];active=-1;
}
function findMatches(){
 clearMarks();
 const q=search.value.trim();
 if(!q){status.textContent=DATA.length+' topics · '+total+' notes';next.disabled=prev.disabled=true;return}
 const lower=q.toLocaleLowerCase();
 const texts=[...document.querySelectorAll('.section-head .title,.node-text')];
 for(const node of texts){
  const original=node.textContent,lo=original.toLocaleLowerCase();
  let from=0,pos;
  const frag=document.createDocumentFragment();
  while((pos=lo.indexOf(lower,from))!==-1){
   frag.append(document.createTextNode(original.slice(from,pos)));
   const mark=el('mark','match',original.slice(pos,pos+q.length));
   frag.append(mark);matches.push(mark);from=pos+q.length;
  }
  if(from){frag.append(document.createTextNode(original.slice(from)));node.replaceChildren(frag)}
 }
 next.disabled=prev.disabled=!matches.length;
 status.textContent=matches.length?(matches.length+' matches · tap Next to jump'):'No matches';
 if(matches.length)go(0);
}
function go(index){
 if(!matches.length)return;
 if(active>=0)matches[active].classList.remove('current');
 active=(index+matches.length)%matches.length;
 const m=matches[active];
 let p=m.parentElement;
 while(p&&p!==content){if(p.classList.contains('collapsed'))p.classList.remove('collapsed');p=p.parentElement}
 m.classList.add('current');
 status.textContent=(active+1)+' of '+matches.length+' matches';
 m.scrollIntoView({block:'center',behavior:'instant'});
}
next.onclick=()=>go(active+1);
prev.onclick=()=>go(active-1);
close.onclick=()=>{search.value='';clearMarks();document.querySelectorAll('.section,.node').forEach(x=>x.classList.toggle('collapsed',x.classList.contains('section') || (x.classList.contains('node') && x.querySelector(':scope > .node-children') && Number(x.dataset.depth)>=1)));status.textContent=DATA.length+' topics · '+total+' notes';next.disabled=prev.disabled=true;search.blur()};
let debounce;
search.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(findMatches,120)});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go(active+(e.shiftKey?-1:1));search.blur()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();search.focus();search.select()}
 if(e.key==='Escape'){close.click();closeMenu()}
});
render();

// Keep the screen awake while this revision page is visible, where supported.
let wakeLock=null;
async function requestWakeLock(){
 if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||wakeLock)return;
 try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}
 catch(error){console.debug('Wake Lock unavailable:',error)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});
document.addEventListener('pointerdown',requestWakeLock,{passive:true});
requestWakeLock();
</script></body></html>
